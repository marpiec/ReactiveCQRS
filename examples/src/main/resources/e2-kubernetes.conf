# E2 (chapter 17) on Kubernetes: e2.conf, with the split brain resolver deciding by a Kubernetes Lease, so the side
# that holds the lease stays, also when no side has a majority (two nodes, or a split in half). The lease is a native
# Kubernetes Lease object (coordination.k8s.io), named after the actor system: shop-pekko-sbr.

include "e2"

pekko {
  cluster.split-brain-resolver {
    active-strategy = lease-majority
    lease-majority.lease-implementation = "pekko.coordination.lease.kubernetes"
  }
  coordination.lease.kubernetes.lease-class = "org.apache.pekko.coordination.lease.kubernetes.NativeKubernetesLease"
}
