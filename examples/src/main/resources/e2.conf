# E2 (chapter 17): a node of the shop. ClusterSetup.nodeConfig adds the node's address, the seed nodes and the
# release's version from the environment.

pekko {
  actor.provider = cluster
  # Messages between nodes go through the library's serializer. Its reference.conf says so too, but pekko-actor's says
  # otherwise, and which of the two wins depends on the order of the classpath (F178): the application decides.
  actor.serialization-bindings { "java.io.Serializable" = reactivecqrs }
  remote.artery.canonical.port = 17355

  cluster {
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    # Three nodes: the bigger side of a split stays. With two, there is no majority: see e2-kubernetes.conf.
    split-brain-resolver.active-strategy = keep-majority
  }

  # A node that leaves the cluster, or is downed, ends its process; its container is started again.
  coordinated-shutdown.exit-jvm = on

  # Pekko Management: the health checks for load balancers and Kubernetes probes. Ready once the event bus knows all
  # its subscribers (chapter 17, "Is this node ready?").
  management {
    http {
      bind-hostname = "0.0.0.0" # probes come to the pod's address
      port = 8558
    }
    health-checks.readiness-checks {
      reactivecqrs = "io.reactivecqrs.core.cluster.ReadinessCheck"
    }
  }
}
