# E2 (chapter 17): three nodes of the shop on Kubernetes, joining through Cluster Bootstrap, with the split brain
# resolver's lease.
#
#   kubectl create secret generic shop-db --from-literal=url=jdbc:postgresql://<host>:5432/shop \
#     --from-literal=user=<user> --from-literal=password=<password>
#   kubectl apply -f examples/deploy/e2/kubernetes.yaml
#
# The image is the one examples/deploy/e2/Dockerfile builds, where the cluster can pull it; the database is yours.
# The nodes find each other through the Kubernetes API (the pods labelled app=shop) and join the cluster those report;
# the first time, all three together form one (F180: seed nodes would split it at a rolling restart). Each node's
# address is its pod IP. The split brain resolver keeps the side that holds a Kubernetes Lease (lease-majority,
# e2-kubernetes.conf), so it decides with two nodes too. The pods' service account may read pods and leases.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop
rules:
  # Cluster Bootstrap's discovery of the contact points.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  # The split brain resolver's lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop
subjects:
  - kind: ServiceAccount
    name: shop
roleRef:
  kind: Role
  name: shop
  apiGroup: rbac.authorization.k8s.io
---
# The StatefulSet's governing service: the pods' DNS names, which nothing here relies on.
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  clusterIP: None
  selector:
    app: shop
  ports:
    - name: remoting
      port: 17355
    - name: management
      port: 8558
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shop
spec:
  serviceName: shop
  replicas: 3
  # All three start at once: the first formation needs the three contact points. A rolling update still replaces one
  # pod at a time, the newest first, each once the one before is ready.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      serviceAccountName: shop
      # Longer than the shutdown of a node that hands over its owners and singletons (90 s for the shard regions).
      terminationGracePeriodSeconds: 120
      containers:
        - name: shop
          image: reactivecqrs-e2:1.0.0
          ports:
            - name: remoting
              containerPort: 17355
            - name: management
              containerPort: 8558
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_HOST
              value: "$(POD_IP)"
            - name: REQUIRED_CONTACT_POINTS
              value: "3"
            - name: APP_VERSION
              value: "1.0.0"
            - name: SHOP_CONFIG
              value: "e2-kubernetes"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: password
          # Pekko Management's health checks: ready once the event bus knows all its subscribers (ReadinessCheck).
          readinessProbe:
            httpGet:
              path: /ready
              port: management
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: management
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 6
