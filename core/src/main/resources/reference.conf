# ReactiveCQRS defaults. A host overrides them in its application.conf.
reactivecqrs {
  # F27: the library's synchronous JDBC work runs here, not on the default dispatcher: aggregate owners (persisting,
  # restoring), the reads and writes the library runs in futures, the outbox poller's and the squash scheduler's reads.
  # Projections should run here too: Props(...).withDispatcher(BlockingDispatcher.id). Size it near the JDBC pool.
  blocking-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 32
    }
    throughput = 1
  }
}
