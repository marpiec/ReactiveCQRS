# ReactiveCQRS defaults. A host overrides them in its application.conf.
reactivecqrs {
  # F27: the library's synchronous JDBC work runs here, not on the default dispatcher: aggregate owners (persisting,
  # restoring), the reads and writes the library runs in futures, the outbox poller's and the squash scheduler's reads.
  # Projections should run here too: Props(...).withDispatcher(BlockingDispatcher.id). Size it near the JDBC pool.
  blocking-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 32
    }
    throughput = 1
  }
}

# D45: messages between cluster nodes go through one serializer built on mpjsons; Java serialization stays off. Bound to
# java.io.Serializable, so case classes and Scala collections without a more specific serializer come to it.
pekko.actor {
  serializers {
    reactivecqrs = "io.reactivecqrs.core.cluster.ClusterSerializer"
  }
  serialization-bindings {
    "java.io.Serializable" = reactivecqrs
    # Pekko binds exceptions to Java serialization, so a Status.Failure would bring them as Pekko's
    # ThrowableNotSerializableException; the library's own keep their class.
    "io.reactivecqrs.api.NoEventsForAggregateException" = reactivecqrs
    "io.reactivecqrs.api.AggregateRestoreFailedException" = reactivecqrs
    "io.reactivecqrs.api.AggregateInIncorrectVersionException" = reactivecqrs
    "io.reactivecqrs.api.AggregateSquashedException" = reactivecqrs
    "io.reactivecqrs.api.EventTooLargeException" = reactivecqrs
    "io.reactivecqrs.api.TooManyEventsException" = reactivecqrs
    "io.reactivecqrs.core.commandhandler.IdempotencyKeyTakenException" = reactivecqrs
    "io.reactivecqrs.core.cluster.RemoteFailure" = reactivecqrs
  }
}
