# ReactiveCQRS defaults. A host overrides them in its application.conf.
reactivecqrs {
  # D39: this installation's aggregate ids are installation-number × 10^12 onwards (IdRange); 0 is the legacy range of
  # the ids made before 1.0. Every node of an installation sets the same number.
  installation-number = 0

  # F27: the library's synchronous JDBC work runs here, not on the default dispatcher: aggregate owners (persisting,
  # restoring), the reads and writes the library runs in futures, the outbox poller's and the squash scheduler's reads.
  # Projections should run here too: Props(...).withDispatcher(BlockingDispatcher.id). Size it near the JDBC pool.
  blocking-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 32
    }
    throughput = 1
  }

  # F127: the application's command handlers run here, not on the default dispatcher, so a handler that holds its
  # thread (computing or waiting for long) slows the commands only, never the buses, projections and sagas that run on
  # the default dispatcher. A handler with heavy work returns an AsyncCommandResult on threads of its own instead
  # (docs/SCALING.md §11).
  handler-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 32
    }
  }
}

# D72: a hand-over (a rebalance, or a node that leaves) waits for every sharded owner to finish the commands it is
# running, which may take up to their context's commandTimeout (60 s by default). Pekko stops an entity forcefully 5 s
# before handoff-timeout, and a leaving node hands its shards over within the shutdown phase's timeout (10 s in Pekko):
# both are set above the default command timeout. A host with longer command timeouts raises them, and its process
# manager must wait longer still before it kills a node (Kubernetes: terminationGracePeriodSeconds).
pekko.cluster.sharding.handoff-timeout = 90 s
pekko.coordinated-shutdown.phases.cluster-sharding-shutdown-region.timeout = 90 s

# D45: messages between cluster nodes go through one serializer built on mpjsons; Java serialization stays off. Bound to
# java.io.Serializable, so case classes and Scala collections without a more specific serializer come to it.
pekko.actor {
  serializers {
    reactivecqrs = "io.reactivecqrs.core.cluster.ClusterSerializer"
  }
  serialization-bindings {
    "java.io.Serializable" = reactivecqrs
    # Pekko binds exceptions to Java serialization, so a Status.Failure would bring them as Pekko's
    # ThrowableNotSerializableException; the library's own keep their class.
    "io.reactivecqrs.api.NoEventsForAggregateException" = reactivecqrs
    "io.reactivecqrs.api.AggregateRestoreFailedException" = reactivecqrs
    "io.reactivecqrs.api.AggregateInIncorrectVersionException" = reactivecqrs
    "io.reactivecqrs.api.AggregateSquashedException" = reactivecqrs
    "io.reactivecqrs.api.EventTooLargeException" = reactivecqrs
    "io.reactivecqrs.api.TooManyEventsException" = reactivecqrs
    "io.reactivecqrs.api.MessageTooLargeException" = reactivecqrs
    "io.reactivecqrs.core.commandhandler.IdempotencyKeyTakenException" = reactivecqrs
    "io.reactivecqrs.core.cluster.RemoteFailure" = reactivecqrs
  }
}
